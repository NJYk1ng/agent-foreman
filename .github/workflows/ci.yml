name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Foreman check + regression tests
        run: |
          ./scripts/foreman-check.sh
          bash tests/test-install.sh
          bash tests/test-notify-lead.sh
          bash tests/test-foreman-check.sh
